#
# The built-in game pack: `fmzx-pack games games/games.toml -o pack.bin`.
# Syntax and the default key map: docs/controls.md. Licences: third_party/games/<id>/README.md.
# The games' learned music, the pack's sound section: sound.toml, written by tools/games-sound.
sound = "sound.toml"

# Our test programs (`fmzx-pack testprogs games/test`; host/crates/fmzx-pack/src/testprogs.rs).
[[game]]
id = "scroll"
name = "Scroll test"
file = "test/scroll.sna"

[[game]]
id = "border"
name = "Border and tone test"
file = "test/border.sna"

# Castaway: press 1 for keyboard control (OCT-). O/P left/right, Q jump, SPACE fire, H pause;
# CAPS SHIFT + 0 (SEQ + ARP) ends the game.
# demo: any key past the title, 1 (keyboard), then every second a short step left and right on
# the ship's platform (so the player stays out of the crawler's reach and the energy lasts) and
# a shot every fourth second: 20 s of play with a moving player.
[[game]]
id = "castaway"
name = "Castaway"
file = "../third_party/games/castaway/castawy.tap"
demo = "button.OCT-@12000, button.OCT-@14500, note.F3@16000+300, note.A3@16600+200, note.F3@17000+300, note.A3@17600+200, note.F3@18000+300, note.A3@18600+200, note.F3@19000+300, note.A3@19600+200, note.C5@19850, note.F3@20000+300, note.A3@20600+200, note.F3@21000+300, note.A3@21600+200, note.F3@22000+300, note.A3@22600+200, note.F3@23000+300, note.A3@23600+200, note.C5@23850, note.F3@24000+300, note.A3@24600+200, note.F3@25000+300, note.A3@25600+200, note.F3@26000+300, note.A3@26600+200, note.F3@27000+300, note.A3@27600+200, note.C5@27850, note.F3@28000+300, note.A3@28600+200, note.F3@29000+300, note.A3@29600+200, note.F3@30000+300, note.A3@30600+200, note.F3@31000+300, note.A3@31600+200, note.C5@31850, note.F3@32000+300, note.A3@32600+200, note.F3@33000+300, note.A3@33600+200, note.F3@34000+300, note.A3@34600+200, note.F3@35000+300, note.A3@35600+200, note.C5@35850"

[game.keys]
"note.F3" = "key.O"                     # left
"note.F#3" = "key.Q"                    # jump
"note.G3" = "none"                      # (no down)
"note.G#3" = "key.Q"                    # jump
"note.A3" = "key.P"                     # right
"note.C5" = "key.SPACE"                 # fire
"note.D5" = "key.SPACE"
"note.E5" = "key.SPACE"
"note.F5" = "key.SPACE"
"note.G5" = "key.SPACE"
"note.B3" = "key.H"                     # pause

# Escape from Colony 8: press 1 for keyboard control (OCT-). O/P left/right, Q/A up/down, SPACE fire
# (hold to charge a missile, release to launch it), H pause; CAPS SHIFT + 0 (SEQ + ARP) leaves
# the game. Option 1 reads keys, so the default Kempston notes (F#3/G#3 up, G3 down) are remapped.
# demo: any key past the title, 1 (keyboard), then every 4 s a walk right, down, left and up with a
# shot on the way, until 36 s (the report window ends at 36 s): the player keeps moving in the first room.
[[game]]
id = "colony8"
name = "Escape from Colony 8"
file = "../third_party/games/colony8/colony8.tap"
demo = "button.OCT-@5000, button.OCT-@7000, note.A3@9000+1000, note.G3@10000+800, note.C5@10200+120, note.F3@10800+1000, note.F#3@11800+800, note.A3@13000+1000, note.G3@14000+800, note.C5@14200+120, note.F3@14800+1000, note.F#3@15800+800, note.A3@17000+1000, note.G3@18000+800, note.C5@18200+120, note.F3@18800+1000, note.F#3@19800+800, note.A3@21000+1000, note.G3@22000+800, note.C5@22200+120, note.F3@22800+1000, note.F#3@23800+800, note.A3@25000+1000, note.G3@26000+800, note.C5@26200+120, note.F3@26800+1000, note.F#3@27800+800, note.A3@29000+1000, note.G3@30000+800, note.C5@30200+120, note.F3@30800+1000, note.F#3@31800+800, note.A3@33000+1000, note.G3@34000+800, note.C5@34200+120, note.F3@34800+1000, note.F#3@35800+800"

[game.keys]
"note.F3" = "key.O"                     # left
"note.A3" = "key.P"                     # right
"note.F#3" = "key.Q"                    # up
"note.G#3" = "key.Q"
"note.G3" = "key.A"                     # down
"note.C5" = "key.SPACE"                 # fire (hold to charge a missile)
"note.D5" = "key.SPACE"
"note.E5" = "key.SPACE"
"note.F5" = "key.SPACE"
"note.G5" = "key.SPACE"
"note.B3" = "key.H"                     # pause

# Black Star: any key leaves the title, then 1 chooses keyboard control (OCT-; 2 is Kempston,
# 3 Sinclair, 4 redefines the keys) and any key skips the intro. O/P left/right, SPACE fire; CAPS
# SHIFT + 0 (SEQ + ARP) ends the game. The title waits for a key, so the notes below are keys: F3 = O,
# A3 = P, C5-G5 = SPACE.
# no demo: the title tune (the ntropic engine) plays on the title screen until a key is pressed,
# and the game itself has no music, so the report window stays on the title with its tune.
[[game]]
id = "blackstar"
name = "Black Star"
file = "../third_party/games/blackstar/blackstr-noscreen.tap"

[game.keys]
"note.F3" = "key.O"                     # left
"note.A3" = "key.P"                     # right
"note.C5" = "key.SPACE"                 # fire
"note.D5" = "key.SPACE"
"note.E5" = "key.SPACE"
"note.F5" = "key.SPACE"
"note.G5" = "key.SPACE"

# Micro INC: any key leaves the title, then 1 chooses keyboard control (OCT-; 2 is Kempston,
# 3 Sinclair, 4 redefines the keys). O/P move the block round the board, SPACE pushes it in, H
# pauses; CAPS SHIFT + 0 (SEQ + ARP) leaves the game. The pack maps F3 = O, A3 = P, C5-G5 = SPACE,
# B3 = H.
# no demo: the title tune (played live by the firmware's built-in entry, the same routine as
# Escape from Colony 8's) plays on the title screen until a key is pressed, and the game itself
# has no music, so the report window stays on the title with its tune.
[[game]]
id = "microinc"
name = "Micro INC"
file = "../third_party/games/microinc/microInc.tap"

[game.keys]
"note.F3" = "key.O"                     # left
"note.A3" = "key.P"                     # right
"note.C5" = "key.SPACE"                 # push the block
"note.D5" = "key.SPACE"
"note.E5" = "key.SPACE"
"note.F5" = "key.SPACE"
"note.G5" = "key.SPACE"
"note.B3" = "key.H"                     # pause

# Magic Tokens: fire (M) leaves the title; Q/A/O/P move the cursor, and fire held with a direction
# swaps two tokens; ENTER (C4) opens the game's menu (restart the level, sound off; it also
# pauses). The game reads the keyboard, Kempston, Sinclair and cursor keys at once; the pack maps
# F3 = O, A3 = P, F#3/G#3 = Q, G3 = A, C5-G5 = M.
# no demo: the title tune (the Stocker engine) plays once, about 67 s, on the animated title
# screen, and the game itself has only short jingles, so the report window stays on the title
# with its tune.
[[game]]
id = "magictokens"
name = "Magic Tokens"
file = "../third_party/games/magictokens/magic_tokens.tap"

[game.keys]
"note.F3" = "key.O"                     # left
"note.A3" = "key.P"                     # right
"note.F#3" = "key.Q"                    # up
"note.G#3" = "key.Q"
"note.G3" = "key.A"                     # down
"note.C5" = "key.M"                     # fire (hold it with a direction to swap)
"note.D5" = "key.M"
"note.E5" = "key.M"
"note.F5" = "key.M"
"note.G5" = "key.M"

# Multi-load test: a tape that loads a screen image from its third block while it runs
# (`fmzx-pack testprogs`). No keys.
[[game]]
id = "tape"
name = "Tape multi-load test"
file = "test/tape.tap"

# Beeper music test: a C major scale, C5 to C6, 25 frames per note, repeated; eight bars on
# the screen (`fmzx-pack testprogs`). No keys.
[[game]]
id = "tune"
name = "Beeper tune test"
file = "test/tune.sna"
