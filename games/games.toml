# Our test programs (`fmzx-pack testprogs games/test`; host/crates/fmzx-pack/src/testprogs.rs).
[[game]]
id = "scroll"
name = "Scroll test"
file = "test/scroll.sna"

[[game]]
id = "border"
name = "Border and tone test"
file = "test/border.sna"

# Castaway: press 1 for keyboard control (OCT-). O/P left/right, Q jump, SPACE fire, H pause;
# CAPS SHIFT + 0 (SEQ + ARP) ends the game.
# demo: any key past the title, 1 (keyboard), then every second a short step left and right on
# the ship's platform (so the player stays out of the crawler's reach and the energy lasts) and
# a shot every fourth second: 20 s of play with a moving player.
[[game]]
id = "castaway"
name = "Castaway"
file = "../third_party/games/castaway/castawy.tap"
demo = "button.OCT-@12000, button.OCT-@14500, note.F3@16000+300, note.A3@16600+200, note.F3@17000+300, note.A3@17600+200, note.F3@18000+300, note.A3@18600+200, note.F3@19000+300, note.A3@19600+200, note.C5@19850, note.F3@20000+300, note.A3@20600+200, note.F3@21000+300, note.A3@21600+200, note.F3@22000+300, note.A3@22600+200, note.F3@23000+300, note.A3@23600+200, note.C5@23850, note.F3@24000+300, note.A3@24600+200, note.F3@25000+300, note.A3@25600+200, note.F3@26000+300, note.A3@26600+200, note.F3@27000+300, note.A3@27600+200, note.C5@27850, note.F3@28000+300, note.A3@28600+200, note.F3@29000+300, note.A3@29600+200, note.F3@30000+300, note.A3@30600+200, note.F3@31000+300, note.A3@31600+200, note.C5@31850, note.F3@32000+300, note.A3@32600+200, note.F3@33000+300, note.A3@33600+200, note.F3@34000+300, note.A3@34600+200, note.F3@35000+300, note.A3@35600+200, note.C5@35850"

[game.keys]
"note.F3" = "key.O"                     # left
"note.F#3" = "key.Q"                    # jump
"note.G3" = "none"                      # (no down)
"note.G#3" = "key.Q"                    # jump
"note.A3" = "key.P"                     # right
"note.C5" = "key.SPACE"                 # fire
"note.D5" = "key.SPACE"
"note.E5" = "key.SPACE"
"note.F5" = "key.SPACE"
"note.G5" = "key.SPACE"
"note.B3" = "key.H"                     # pause

# ZX Sopwith: Q/A pull up and down, O/P throttle down and up, SPACE fire, F flip, B bomb, H fly home,
# M sound, 1 abandon. The default Kempston notes fly and fire the same way (F#3/G#3 up, F3/G3/A3
# down, C#5 throttle down, D#5 throttle up, C5-G5 fire); F4 (N) starts a novice game, and the keys below add
# the rest: A#3 = F, B3 = B, C4 = H, C#4 = C (against the computer), D#4 = E (expert), LFO = M.
# demo: N starts a novice game, four throttle-up steps, then every few seconds a pull-up, a shot, a
# dive, a bomb and a flip: 30 s with the plane and the status bar moving (a crash only starts the
# next of five planes).
[[game]]
id = "sopwith"
name = "ZX Sopwith"
file = "../third_party/games/sopwith/sopwith.sna"
demo = "note.F4@2500+200, note.D#5@4500+150, note.D#5@5000+150, note.D#5@5500+150, note.D#5@6000+150, note.F#3@8000+700, note.C5@9400+200, note.G3@10300+400, note.F#3@11400+500, note.C5@12600+200, note.B3@13500+150, note.A#3@14350+150, note.G3@15200+300, note.F#3@16200+700, note.C5@17600+200, note.G3@18500+400, note.F#3@19600+500, note.C5@20800+200, note.B3@21700+150, note.A#3@22550+150, note.G3@23400+300, note.F#3@24400+700, note.C5@25800+200, note.G3@26700+400, note.F#3@27800+500, note.C5@29000+200, note.B3@29900+150, note.A#3@30750+150, note.G3@31600+300"

[game.keys]
"note.A#3" = "key.F"                    # flip
"note.B3" = "key.B"                     # bomb
"note.C4" = "key.H"                     # fly home
"note.C#4" = "key.C"                    # start against the computer
"note.D#4" = "key.E"                    # start an expert game
"button.LFO" = "key.M"                  # sound on and off

# Escape from Colony 8: press 1 for keyboard control (OCT-). O/P left/right, Q/A up/down, SPACE fire
# (hold to charge a missile, release to launch it), H pause; CAPS SHIFT + 0 (SEQ + ARP) leaves
# the game. Option 1 reads keys, so the default Kempston notes (F#3/G#3 up, G3 down) are remapped.
# demo: any key past the title, 1 (keyboard), then every 4 s a walk right, down, left and up with a
# shot on the way, until 36 s (the report window ends at 36 s): the player keeps moving in the first room.
[[game]]
id = "colony8"
name = "Escape from Colony 8"
file = "../third_party/games/colony8/colony8.tap"
demo = "button.OCT-@5000, button.OCT-@7000, note.A3@9000+1000, note.G3@10000+800, note.C5@10200+120, note.F3@10800+1000, note.F#3@11800+800, note.A3@13000+1000, note.G3@14000+800, note.C5@14200+120, note.F3@14800+1000, note.F#3@15800+800, note.A3@17000+1000, note.G3@18000+800, note.C5@18200+120, note.F3@18800+1000, note.F#3@19800+800, note.A3@21000+1000, note.G3@22000+800, note.C5@22200+120, note.F3@22800+1000, note.F#3@23800+800, note.A3@25000+1000, note.G3@26000+800, note.C5@26200+120, note.F3@26800+1000, note.F#3@27800+800, note.A3@29000+1000, note.G3@30000+800, note.C5@30200+120, note.F3@30800+1000, note.F#3@31800+800, note.A3@33000+1000, note.G3@34000+800, note.C5@34200+120, note.F3@34800+1000, note.F#3@35800+800"

[game.keys]
"note.F3" = "key.O"                     # left
"note.A3" = "key.P"                     # right
"note.F#3" = "key.Q"                    # up
"note.G#3" = "key.Q"
"note.G3" = "key.A"                     # down
"note.C5" = "key.SPACE"                 # fire (hold to charge a missile)
"note.D5" = "key.SPACE"
"note.E5" = "key.SPACE"
"note.F5" = "key.SPACE"
"note.G5" = "key.SPACE"
"note.B3" = "key.H"                     # pause

# ZX Dino: any key starts a run (and restarts after a crash), SPACE or Q jumps, A or CAPS SHIFT ducks
# under low birds. The game reads keys only, so the default Kempston notes are remapped: F#3/G#3 jump
# (Q), C5-G5 jump (SPACE), G3 duck (A); SEQ is CAPS SHIFT and the other buttons start a run.
# demo: OCT- starts a run past the title, then a jump every 1.1 s until 36 s (the report window ends
# at 36 s); a crash only waits for the next jump to start a new run.
[[game]]
id = "dino"
name = "ZX Dino"
file = "../third_party/games/dino/dino.tap"
demo = "button.OCT-@7000, note.F#3@9000+200, note.F#3@10100+200, note.F#3@11200+200, note.F#3@12300+200, note.F#3@13400+200, note.F#3@14500+200, note.F#3@15600+200, note.F#3@16700+200, note.F#3@17800+200, note.F#3@18900+200, note.F#3@20000+200, note.F#3@21100+200, note.F#3@22200+200, note.F#3@23300+200, note.F#3@24400+200, note.F#3@25500+200, note.F#3@26600+200, note.F#3@27700+200, note.F#3@28800+200, note.F#3@29900+200, note.F#3@31000+200, note.F#3@32100+200, note.F#3@33200+200, note.F#3@34300+200, note.F#3@35400+200"

[game.keys]
"note.F#3" = "key.Q"                    # jump
"note.G#3" = "key.Q"
"note.C5" = "key.SPACE"                 # jump
"note.D5" = "key.SPACE"
"note.E5" = "key.SPACE"
"note.F5" = "key.SPACE"
"note.G5" = "key.SPACE"
"note.G3" = "key.A"                     # duck

# A World of One-Way: Q/A/O/P move (each move slides to a wall). CAPS SHIFT + ENTER restarts the
# level or returns to the menu, and the shop takes 1 and 2. The game reads keys only, so the default Kempston notes are remapped: F3 = O (left), A3 = P (right),
# F#3/G#3 = Q (up), G3 = A (down); OCT- and OCT+ are 1 and 2 (menu start, shop), SEQ + C4 is
# CAPS SHIFT + ENTER.
# demo: OCT- (1) at 8 s, 10 s and 12 s passes the title (any key) and starts the game from the menu
# (a later press is only a Sinclair move), then every 1.2 s from 14 s a move left, up, right and down
# until 36 s (the report window ends at 36 s), so the heroes keep sliding in the first level.
[[game]]
id = "oneway"
name = "A World of One-Way"
file = "../third_party/games/oneway/Wow.tap"
demo = "button.OCT-@8000, button.OCT-@10000, button.OCT-@12000, note.F3@14000+150, note.F#3@15200+150, note.A3@16400+150, note.G3@17600+150, note.F3@18800+150, note.F#3@20000+150, note.A3@21200+150, note.G3@22400+150, note.F3@23600+150, note.F#3@24800+150, note.A3@26000+150, note.G3@27200+150, note.F3@28400+150, note.F#3@29600+150, note.A3@30800+150, note.G3@32000+150, note.F3@33200+150, note.F#3@34400+150"

[game.keys]
"note.F3" = "key.O"                     # left
"note.A3" = "key.P"                     # right
"note.F#3" = "key.Q"                    # up
"note.G#3" = "key.Q"
"note.G3" = "key.A"                     # down

