[package]
name = "fmzx-pack"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# src/fwsc.rs and src/lz4blk.rs are GPL-3.0-only (ports of Felucca's tools), the rest GPL-3.0-or-later.
license = "GPL-3.0-or-later AND GPL-3.0-only"
publish = false

[dependencies]
crc32fast = "1.5.5"
lz4_flex = "0.14.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
zx-sys = { path = "../zx-sys" }

[dev-dependencies]
# fm1-emu's package reader (MIT), to read our packages back in the tests; needs Rust 1.99 for the
# tests only (the tool itself keeps the workspace's rust-version).
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "93cb7ee3f7008b27959ba73073b864e37efd7289" }
zx-tests = { path = "../zx-tests" }

[lints]
workspace = true
