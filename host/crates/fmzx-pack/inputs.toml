# Inputs of the update package that are not built here (fmzx-pack fwsc, src/inputs.rs).

# Three files from JieLi's AC79 SDK (Apache-2.0, docs/third-party/AC79-SDK-Apache-2.0.txt), version
# AC79NN_SDK_V1.2.1_2023-12-13. fmzx-pack fetches them with curl into build/ac79/ (the cache) and
# uses a file only when its SHA-256 matches; nothing fetched is committed.
[sdk]
base = "https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK/raw/AC79NN_SDK_V1.2.1_2023-12-13/cpu/wl82/tools/"

[[sdk.file]]
path = "uboot.boot"
sha256 = "4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4"

[[sdk.file]]
path = "cfg_tool.bin"
sha256 = "276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b"

[[sdk.file]]
path = "cfg/eq_cfg_hw.bin"
sha256 = "41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d"

# Felucca 1.6.1's update loader, built from third_party/felucca-loader (target felucca_loader;
# the same pin is checked by the build, platform/fm1/CMakeLists.txt).
[loader]
size = 8216
sha256 = "2cde42b729d787a3e591ed4eaaffbbf33cebee7d58421d33bf6b6d27cc03f1aa"
