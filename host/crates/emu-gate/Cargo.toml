[package]
name = "emu-gate"
version = "0.1.0"
edition.workspace = true
rust-version = "1.99"
license = "GPL-3.0-or-later AND MPL-2.0"  # src/upgrade.rs is MPL-2.0 (LICENSING.md)
publish = false

[dependencies]
fm1-core = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "93cb7ee3f7008b27959ba73073b864e37efd7289" }
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "93cb7ee3f7008b27959ba73073b864e37efd7289" }
fmzx-pack = { path = "../fmzx-pack" }
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
png = "0.18"

[dev-dependencies]
music = { path = "../music" }
soundlearn = { path = "../soundlearn" }
zx-sys = { path = "../zx-sys" }

[lints]
workspace = true
