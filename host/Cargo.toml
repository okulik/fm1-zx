[workspace]
resolver = "2"
members = ["crates/zx-sys", "crates/zx-tests", "crates/emu-gate", "crates/fmzx-pack"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.test]
opt-level = 3
