version = 1

[[annotations]]
path = [
  "CMakePresets.json",
  "tools/docker/toolchain.sha256",
  "tools/test-data.sha256",
  "host/Cargo.lock",
  "host/crates/zx-tests/tests/golden/hashes.txt",
  "host/crates/emu-gate/tests/golden/*.png",
  "games/test/scroll.sna",
  "games/test/border.sna",
  "games/test/tape.tap",
  "docs/superpowers/**",
  "web/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 FM-1 ZX contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "third_party/zx-rom/48.rom"
precedence = "aggregate"
SPDX-FileCopyrightText = "Amstrad plc"
SPDX-License-Identifier = "LicenseRef-Amstrad-ZX-ROM"

# Vendored libraries keep their own files unmodified; their licences are stated
# in COPYING.LESSER / LICENSE-0BSD and in each README.
[[annotations]]
path = "third_party/Z80/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "1999-2026 Manuel Sainz de Baranda y Goñi"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = "third_party/Z80InsnClock/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2021-2025 Sofía Ortega Sosa"
SPDX-License-Identifier = "0BSD"

# Built-in games: unmodified files with their upstream licence texts; licence
# statements quoted in each README.md.
[[annotations]]
path = "third_party/games/castaway/castawy.tap"
precedence = "override"
SPDX-FileCopyrightText = "2016 Juan J. Martinez"
SPDX-License-Identifier = "MIT OR (GPL-3.0-only AND CC-BY-SA-2.0)"

[[annotations]]
path = "third_party/games/castaway/README.release.txt"
precedence = "override"
SPDX-FileCopyrightText = "2016 Juan J. Martinez"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/games/castaway/README.upstream.md"
precedence = "override"
SPDX-FileCopyrightText = "2016 Juan J. Martinez"
SPDX-License-Identifier = "GPL-3.0-only"

# The GPL's own text, as shipped in the Castaway repository.
[[annotations]]
path = "third_party/games/castaway/gpl-3.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-only"

# felucca-bsp (platform/fm1/VENDORED.md): its licence text and NOTICE, unmodified.
[[annotations]]
path = ["platform/fm1/bsp/LICENSE", "platform/fm1/bsp/NOTICE"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Leo Kuroshita (@kurogedelic), Hügelton Instruments"
SPDX-License-Identifier = "MPL-2.0"

# The licence text of the JieLi AC79 SDK files the update packages carry (not in the repository;
# LICENSING.md), shipped next to the packages by tools/make-packages. Unmodified.
[[annotations]]
path = "docs/third-party/AC79-SDK-Apache-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "LicenseRef-Apache-2.0-text"
